<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS3 Unified Topology Widget</title>
<style>
:root{--bg:#0f0f1a;--bg-raised:#1a1a2e;--bg-muted:#16162a;--border:#2a2a4a;--text-primary:#e8e8f0;--text-secondary:#a0a0c0;--text-tertiary:#707090;--text-quaternary:#505070;--accent:#4a9eff;--radius-sm:6px;--radius-md:10px;--radius-lg:12px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--font-mono:"SF Mono","Cascadia Code","Fira Code",Consolas,monospace}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text-primary);line-height:1.5;min-height:100vh}
.container{max-width:1400px;margin:0 auto;padding:20px}
.header{margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
.header h1{font-size:24px;font-weight:600;letter-spacing:-0.5px}
.header .subtitle{font-size:13px;color:var(--text-tertiary);margin-top:4px}
.meta{font-size:12px;color:var(--text-quaternary);display:flex;gap:14px;flex-wrap:wrap}
.meta .val{color:var(--text-secondary);font-weight:500;font-family:var(--font-mono)}
.controls{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.search-wrap{flex:1;min-width:220px;position:relative}
.search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;background:var(--bg-raised);color:var(--text-primary);outline:none;font-family:var(--font-sans)}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:var(--text-quaternary)}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;border:1px solid var(--border);background:var(--bg-raised);color:var(--text-secondary);transition:all .15s;user-select:none}
.pill:hover{border-color:var(--text-secondary);color:var(--text-primary)}
.pill.active{background:var(--text-primary);color:var(--bg);border-color:var(--text-primary);font-weight:600}
.pill .count{margin-left:6px;opacity:.7;font-family:var(--font-mono);font-size:11px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{padding:9px 16px;font-size:13px;font-weight:500;color:var(--text-tertiary);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;border-radius:var(--radius-sm) var(--radius-sm) 0 0}
.tab:hover{color:var(--text-secondary);background:var(--bg-muted)}
.tab.active{color:var(--text-primary);border-bottom-color:var(--accent)}
.panel{display:none}
.panel.active{display:block}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-md);padding:14px;text-align:center}
.stat .val{font-size:28px;font-weight:600;color:var(--text-primary);font-family:var(--font-mono);line-height:1}
.stat .label{font-size:11px;color:var(--text-tertiary);margin-top:6px;text-transform:lowercase}
.graph-wrap{position:relative;height:min(620px,70vh);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-raised);overflow:hidden}
.graph-wrap canvas{width:100%;height:100%;cursor:grab;display:block}
.graph-wrap canvas:active{cursor:grabbing}
.graph-tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
.graph-tool{width:34px;height:34px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-muted);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px}
.graph-tool:hover{background:var(--bg-raised);color:var(--text-primary);border-color:var(--text-secondary)}
.graph-legend{position:absolute;bottom:10px;left:10px;background:var(--bg-muted);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;font-size:11px;max-width:min(420px,55vw)}
.graph-legend-item{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.graph-legend-item:last-child{margin-bottom:0}
.graph-legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.tooltip{position:fixed;pointer-events:none;background:rgba(22,22,42,.96);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;font-size:12px;color:var(--text-primary);max-width:min(360px,70vw);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:1000;transition:opacity .08s}
.tooltip h3{font-size:13px;margin-bottom:6px;color:var(--text-primary)}
.tooltip .meta{color:var(--text-tertiary);margin-bottom:6px}
.tooltip .link{color:var(--accent);text-decoration:none}
.tooltip .link:hover{text-decoration:underline}
.tooltip .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tooltip .chip{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--bg-raised);border:1px solid var(--border);color:var(--text-secondary)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--bg-raised);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s,border-color .18s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.35);border-color:#3b4252}
.card.hidden{display:none}
.card.dim{opacity:.22;transform:scale(.98);pointer-events:none}
.card-header{height:5px;width:100%;flex-shrink:0}
.card-body{padding:14px;display:flex;gap:12px;align-items:flex-start;flex:1}
.card-thumb{width:44px;height:44px;border-radius:8px;object-fit:contain;background:var(--bg-muted);border:1px solid var(--border);flex-shrink:0}
.card-info{flex:1;min-width:0}
.card-title{font-size:.95rem;font-weight:700;color:var(--text-primary);text-decoration:none;display:block;margin-bottom:4px;line-height:1.25}
.card-title:hover{color:var(--accent);text-decoration:underline}
.card-desc{font-size:.82rem;color:var(--text-tertiary);line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-badges{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip-xp{background:#d2b244;color:#1a1a1a}
.chip-economic{background:#409c76;color:#fff}
.chip-combat{background:#bc483d;color:#fff}
.chip-guide{background:#6385a8;color:#fff}
.chip-league{background:#b07cc8;color:#1a1a1a}
.chip-material{background:#8c7b5b;color:#fff}
.empty{text-align:center;padding:60px 20px;color:var(--text-quaternary);font-size:14px;grid-column:1/-1}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--text-quaternary)}
@media(max-width:860px){.container{padding:14px}.header h1{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.graph-legend{max-width:60vw;font-size:10px;padding:8px}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <h1>RS3 Unified Topology Widget</h1>
      <div class="subtitle">Domain-agnostic wiki graph + calculators + league + materials</div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="controls">
    <div class="search-wrap"><input type="text" class="search" id="search" placeholder="Search nodes, calculators, league entities..." autocomplete="off"></div>
    <button class="pill active" data-filter="all">All <span class="count" id="count-all">0</span></button>
    <button class="pill" data-filter="wiki">Wiki <span class="count" id="count-wiki">0</span></button>
    <button class="pill" data-filter="calculator">Calculators <span class="count" id="count-calc">0</span></button>
    <button class="pill" data-filter="league">Leagues <span class="count" id="count-league">0</span></button>
    <button class="pill" data-filter="material">Materials <span class="count" id="count-mat">0</span></button>
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="graph">Network graph</div>
    <div class="tab" data-tab="nodes">Nodes</div>
    <div class="tab" data-tab="calculators">Calculators</div>
    <div class="tab" data-tab="league">League</div>
    <div class="tab" data-tab="materials">Materials</div>
  </div>
  <div class="panel active" id="panel-graph">
    <div class="stats" id="graph-stats"></div>
    <div class="graph-wrap">
      <canvas id="graph"></canvas>
      <div class="graph-tools">
        <div class="graph-tool" id="zoom-in" title="Zoom in">+</div>
        <div class="graph-tool" id="zoom-out" title="Zoom out">−</div>
        <div class="graph-tool" id="reset-view" title="Reset">⟲</div>
      </div>
      <div class="graph-legend" id="legend"></div>
    </div>
  </div>
  <div class="panel" id="panel-nodes">
    <div class="stats" id="node-stats"></div>
    <div class="controls"><div class="search-wrap"><input type="text" class="search" id="node-search" placeholder="Filter nodes..." autocomplete="off"></div></div>
    <div class="grid" id="node-grid"></div>
  </div>
  <div class="panel" id="panel-calculators">
    <div class="stats" id="calc-stats"></div>
    <div class="grid" id="calc-grid"></div>
  </div>
  <div class="panel" id="panel-league">
    <div class="stats" id="league-stats"></div>
    <div class="grid" id="league-grid"></div>
  </div>
  <div class="panel" id="panel-materials">
    <div class="stats" id="mat-stats"></div>
    <div class="grid" id="mat-grid"></div>
  </div>
</div>
<div class="tooltip" id="tooltip" style="opacity:0"></div>
<script>
const WIKI_BASE='https://runescape.wiki/w';
const DOMAINS={wiki:'Wiki',calculator:'Calculator',league:'League',material:'Material'};
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function slugify(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}
function canonicalizeArticle(name){return name.trim().replace(/\(furniture\)/g,'').replace(/\s+/g,' ').replace(/[()]+/g, m=>m==='()'?'':m).trim()}

async function loadJSON(url){try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}catch(e){console.warn('Failed to load',url,e);return null}}

function buildTopologyNodes(rawTopology){
  const nodeMap=new Map();const edgeList=[];
  if(!rawTopology||!rawTopology.pages) return {nodes:[],edges:[]};
  for(const [pageName,pageData] of Object.entries(rawTopology.pages)){
    const canonical=canonicalizeArticle(pageName);
    if(!nodeMap.has(canonical)) nodeMap.set(canonical,{id:canonical,label:canonical,domain:'wiki',in_degree:pageData.out_degree||0,backlinks:[],connections:new Set(),sources:new Set()});
    const src=nodeMap.get(canonical);src.sources.add('topology');
    for(const target of pageData.unique_links||[]){
      const tCanon=canonicalizeArticle(target);
      if(!nodeMap.has(tCanon)) nodeMap.set(tCanon,{id:tCanon,label:tCanon,domain:'wiki',in_degree:0,backlinks:[],connections:new Set(),sources:new Set()});
      const tgt=nodeMap.get(tCanon);tgt.sources.add('topology');tgt.backlinks.push(canonical);
      src.connections.add(tCanon);tgt.connections.add(canonical);
      edgeList.push({source:canonical,target:tCanon,kind:'wiki-link'});
    }
  }
  const nodes=Array.from(nodeMap.values()).map(n=>({id:n.id,label:n.label,domain:'wiki',in_degree:n.in_degree,backlinks:n.backlinks,connections:Array.from(n.connections),sources:Array.from(n.sources),url:`${WIKI_BASE}/${encodeURIComponent(n.id.replace(/ /g,'_'))}`}));
  const edgeMap=new Map();
  for(const e of edgeList){const key=`${e.source}::${e.target}`;if(!edgeMap.has(key))edgeMap.set(key,{...e,count:0});edgeMap.get(key).count++;}
  const edges=Array.from(edgeMap.values());
  return {nodes,edges};
}

function buildFurnitureNodes(furnData){
  if(!furnData||!furnData.categories||!furnData.categories.wiki_articles) return [];
  return furnData.categories.wiki_articles.map(a=>({id:canonicalizeArticle(a.titles[0]||a.href.replace(/^\/w\//,'').replace(/_/g,' ')),label:a.titles[0]||a.href.replace(/^\/w\//,'').replace(/_/g,' '),domain:'material',occurrences:a.occurrences,href:a.href,url:`https://runescape.wiki${a.href}`,sources:['furniture'],kind:'construction-material'}));
}

function buildCalculatorNodes(calcArray){
  if(!Array.isArray(calcArray))return[];
  return calcArray.map(c=>{
    const tags=[];
    if(c.section) tags.push(c.section);
    if(c.skill_title) tags.push(c.skill_title);
    if(c.badges) for(const b of c.badges) tags.push(b);
    return {
      id:canonicalizeArticle(c.title),
      label:c.title,
      domain:'calculator',
      section:c.section,
      skill:c.skill,
      badges:c.badges||[],
      bg_color:c.bg_color,
      href:c.href,
      img:c.img,
      desc:c.desc,
      url:c.href,
      sources:['calculator-index'],
      kind:'calculator',
      tags:tags,
      creator_link:c.creator_link||null,
      meta:c.meta||{}
    };
  });
}

function buildCalculatorAdjacency(calcNodes){
  const edgeList=[];
  const bySection=new Map();const byBadge=new Map();const bySkill=new Map();
  for(const n of calcNodes){
    const sec=n.section;if(sec)bySection.get(sec)?bySection.get(sec).push(n):bySection.set(sec,[n]);
    for(const b of n.badges||[]){byBadge.get(b)?byBadge.get(b).push(n):byBadge.set(b,[n])}
    const sk=n.skill;if(sk){bySkill.get(sk)?bySkill.get(sk).push(n):bySkill.set(sk,[n])}
  }
  for(const arr of bySection.values())for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)edgeList.push({source:arr[i].id,target:arr[j].id,kind:'section'});
  for(const arr of byBadge.values())for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)edgeList.push({source:arr[i].id,target:arr[j].id,kind:'badge'});
  for(const arr of bySkill.values())for(let i=0;i<arr.length;i++)for(let j=i+1;j<arr.length;j++)edgeList.push({source:arr[i].id,target:arr[j].id,kind:'skill'});
  return edgeList;
}

function buildLeagueNodes(leagueData){
  if(!leagueData)return[];
  const nodes=[];
  nodes.push({id:'equilibrium-league',label:'Equilibrium League',domain:'league',section:'Leagues',kind:'league-root',url:'https://runescape.wiki/w/Leagues_II:_Equilibrium',description:'Event-based game mode: temporary world with special modifiers, relics, blessings, and region unlocks. Not a core gameplay mode.'});
  if(leagueData.relic_tiers)for(const tier of leagueData.relic_tiers)for(const choice of tier.choices||[])nodes.push({id:`relic-${choice.id}`,label:choice.name,domain:'league',section:'Relics',tier:tier.tier,points_required:tier.points_required,skills:choice.skills||[],description:choice.description,icon:choice.icon,url:`https://runescape.wiki/w/${encodeURIComponent(choice.name.replace(/ /g,'_'))}`,kind:'relic',sources:['league']});
  if(leagueData.blessing_tiers)for(const tier of leagueData.blessing_tiers)for(const choice of tier.choices||[])nodes.push({id:`blessing-${choice.id}`,label:choice.name,domain:'league',section:'Blessings',tier:tier.tier,path:choice.path,description:choice.description,url:`https://runescape.wiki/w/${encodeURIComponent(choice.name.replace(/ /g,'_'))}`,kind:'blessing',sources:['league']});
  if(leagueData.regions)for(const region of leagueData.regions||[])nodes.push({id:`region-${region.id}`,label:region.name,domain:'league',section:'Regions',points:region.points,tasks:region.tasks,starting:region.starting,auto_quests:region.auto_quests||[],url:`https://runescape.wiki/w/${encodeURIComponent(region.name.replace(/ /g,'_'))}`,kind:'region',sources:['league']});
  return nodes;
}

function hydrateMissing(topologyNodes,extraNodes){
  const allById=new Map();
  for(const n of [...topologyNodes,...extraNodes])allById.set(slugify(n.id),n);
  for(const n of extraNodes){
    const key=slugify(n.id);if(!allById.has(key))allById.set(key,{...n,in_degree:0,backlinks:[],connections:[]});
    else{const existing=allById.get(key);existing.sources=[...new Set([...existing.sources,...n.sources])];if(n.occurrences)existing.occurrences=(existing.occurrences||0)+n.occurrences;if(!existing.url&&n.url)existing.url=n.url;if(!existing.domain)existing.domain=n.domain;}
  }
  const nameMap=new Map();
  for(const n of allById.values()){const canon=canonicalizeArticle(n.label||n.id);const key=slugify(canon);if(!nameMap.has(key))nameMap.set(key,{...n,id:canon})}
  return Array.from(nameMap.values());
}

function mergeAllSources(topologyResult,furnNodes,calcNodes,leagueNodes){
  const extra=[...furnNodes,...calcNodes,...leagueNodes];
  const hydrated=hydrateMissing(topologyResult.nodes,extra);
  const edges=[...topologyResult.edges];
  const calcEdges=buildCalculatorAdjacency(calcNodes);
  edges.push(...calcEdges);
  const nodeById=new Map(hydrated.map(n=>[slugify(n.id),n]));
  for(const n of extra){
    const key=slugify(n.id);const node=nodeById.get(key);if(!node)continue;
    if(n.href&&n.href.includes('/w/')){
      const targetSlug=slugify(n.href.replace(/^\/w\//,'').replace(/_/g,' '));
      if(nodeById.has(targetSlug)&&targetSlug!==key)edges.push({source:node.id,target:nodeById.get(targetSlug).id,kind:'material-link'});
    }
    if(n.backlinks&&Array.isArray(n.backlinks))for(const bl of n.backlinks){const blSlug=slugify(bl);if(nodeById.has(blSlug))edges.push({source:bl,target:node.id,kind:'backlink'})}
  }
  return {nodes:hydrated,edges};
}

function summarize(nodes,edges){
  const domains={};const kinds={};
  for(const n of nodes){domains[n.domain]=(domains[n.domain]||0)+1;if(n.kind)kinds[n.kind]=(kinds[n.kind]||0)+1;}
  const linkCount=edges.filter(e=>e.kind==='wiki-link').length;
  const matCount=edges.filter(e=>e.kind==='material-link'||e.kind==='backlink'||e.kind==='section' || e.kind==='badge' || e.kind==='skill').length;
  return {totalNodes:nodes.length,totalEdges:edges.length,wikiLinks:linkCount,materialLinks:matCount,domains,kinds};
}

let STATE={nodes:[],edges:[],filter:'all',query:'',hover:null};

function renderMeta(s){
  document.getElementById('meta').innerHTML=`<span>nodes: <span class="val">${s.totalNodes.toLocaleString()}</span></span><span>edges: <span class="val">${s.totalEdges.toLocaleString()}</span></span><span>wiki links: <span class="val">${s.wikiLinks.toLocaleString()}</span></span><span>calculator adjacencies: <span class="val">${s.materialLinks.toLocaleString()}</span></span>`;
  document.getElementById('count-all').textContent=s.totalNodes.toLocaleString();
  document.getElementById('count-wiki').textContent=(s.domains['wiki']||0).toLocaleString();
  document.getElementById('count-calc').textContent=(s.domains['calculator']||0).toLocaleString();
  document.getElementById('count-league').textContent=(s.domains['league']||0).toLocaleString();
  document.getElementById('count-mat').textContent=(s.domains['material']||0).toLocaleString();
}
function renderLegend(nodes){const cats=[...new Set(nodes.map(n=>n.domain))];const palette={wiki:'#4a9eff',calculator:'#d2b244',league:'#b07cc8',material:'#8c7b5b'};document.getElementById('legend').innerHTML=cats.map(c=>`<div class="graph-legend-item"><div class="graph-legend-dot" style="background:${palette[c]||'#888'}"></div><span>${c}</span></div>`).join('')}

function initGraph(){
  const canvas=document.getElementById('graph');const ctx=canvas.getContext('2d');let W,H;
  const resize=()=>{const r=canvas.parentElement.getBoundingClientRect();W=canvas.width=r.width*devicePixelRatio;H=canvas.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)};
  resize();window.addEventListener('resize',resize);
  const nodes=STATE.nodes.map(n=>({...n,x:Math.random()*Math.min(W,800)/devicePixelRatio,y:Math.random()*Math.min(H,600)/devicePixelRatio,vx:0,vy:0}));
  const edges=STATE.edges.map(e=>({...e}));
  const nodeById=new Map(nodes.map(n=>[slugify(n.id),n]));
  const visibleEdges=edges.filter(e=>{const s=nodeById.get(slugify(e.source));const t=nodeById.get(slugify(e.target));return s&&t}).map(e=>({source:nodeById.get(slugify(e.source)),target:nodeById.get(slugify(e.target)),...e}));
  const cam={x:0,y:0,zoom:1};let drag=null,hoverNode=null;
  function step(){
    const w=W/devicePixelRatio,h=H/devicePixelRatio;
    for(const e of visibleEdges){let dx=e.target.x-e.source.x,dy=e.target.y-e.source.y;let dist=Math.sqrt(dx*dx+dy*dy)||1;let force=dist*0.0008;let fx=(dx/dist)*force,fy=(dy/dist)*force;e.source.vx+=fx;e.source.vy+=fy;e.target.vx-=fx;e.target.vy-=fy}
    for(const n of nodes){n.vx+=(w/2-cam.x-n.x)*0.0004;n.vy+=(h/2-cam.y-n.y)*0.0004;n.vx*=0.88;n.vy*=0.88;n.x+=n.vx;n.y+=n.vy;n.x=Math.max(20,Math.min(w-20,n.x));n.y=Math.max(20,Math.min(h-20,n.y))}
  }
  const palette={wiki:'#4a9eff',calculator:'#d2b244',league:'#b07cc8',material:'#8c7b5b'};
  function draw(){
    const w=W/devicePixelRatio,h=H/devicePixelRatio;ctx.clearRect(0,0,w,h);ctx.save();ctx.translate(cam.x+w/2,cam.y+h/2);ctx.scale(cam.zoom,cam.zoom);ctx.translate(-w/2,-h/2);
    ctx.lineWidth=0.6;
    for(const e of visibleEdges){ctx.strokeStyle='rgba(120,120,160,0.12)';ctx.beginPath();ctx.moveTo(e.source.x,e.source.y);ctx.lineTo(e.target.x,e.target.y);ctx.stroke()}
    const filtered=getFilteredNodeKeys();
    for(const n of nodes){if(filtered.size&&!filtered.has(slugify(n.id)))continue;const color=palette[n.domain]||'#888';const r=Math.max(2.2,2.4+Math.log2((n.in_degree||n.connections?.length||1)+1)*1.1);ctx.beginPath();ctx.arc(n.x,n.y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();if(hoverNode===n){ctx.strokeStyle='#fff';ctx.lineWidth=1.6;ctx.stroke()}}
    if(hoverNode){ctx.fillStyle='#fff';ctx.font='12px var(--font-sans)';const tx=hoverNode.x+10,ty=hoverNode.y-10;const text=hoverNode.label;const metrics=ctx.measureText(text);const pw=metrics.width+12,ph=22;ctx.fillStyle='rgba(22,22,42,.92)';ctx.beginPath();ctx.roundRect(tx-6,ty-ph+4,pw,ph,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillText(text,tx,ty)}
    ctx.restore();
  }
  function loop(){step();draw();requestAnimationFrame(loop)}loop();
  const getFilteredNodeKeys=()=>{if(STATE.filter==='all')return new Set();return new Set(STATE.nodes.filter(n=>n.domain===STATE.filter).map(n=>slugify(n.id)))};
  function hitTest(px,py){const w=W/devicePixelRatio,h=H/devicePixelRatio;const x=(px-cam.x-w/2)/cam.zoom+w/2;const y=(py-cam.y-h/2)/cam.zoom+h/2;const filtered=getFilteredNodeKeys();for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(filtered.size&&!filtered.has(slugify(n.id)))continue;const r=Math.max(2.2,2.4+Math.log2((n.in_degree||n.connections?.length||1)+1)*1.1)+5;if(Math.hypot(n.x-x,n.y-y)<r)return n}return null}
  canvas.addEventListener('mousemove',e=>{const r=canvas.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;if(drag){drag.x=px;drag.y=py;drag.vx=0;drag.vy=0}else{hoverNode=hitTest(px,py);canvas.style.cursor=hoverNode?'pointer':'grab'}updateTooltip(e,hoverNode)});
  canvas.addEventListener('mousedown',e=>{const r=canvas.getBoundingClientRect();const px=e.clientX-r.left,py=e.clientY-r.top;drag=hitTest(px,py);if(drag)canvas.style.cursor='grabbing'});
  canvas.addEventListener('mouseup',()=>{drag=null;canvas.style.cursor=hoverNode?'pointer':'grab'});
  canvas.addEventListener('mouseleave',()=>{drag=null;hoverNode=null;canvas.style.cursor='grab';hideTooltip()});
  canvas.addEventListener('wheel',e=>{e.preventDefault();const f=e.deltaY>0?0.88:1.12;cam.zoom=Math.max(0.15,Math.min(6,cam.zoom*f))},{passive:false});
  document.getElementById('zoom-in').onclick=()=>cam.zoom=Math.min(6,cam.zoom*1.35);
  document.getElementById('zoom-out').onclick=()=>cam.zoom=Math.max(0.15,cam.zoom/1.35);
  document.getElementById('reset-view').onclick=()=>{cam.x=0;cam.y=0;cam.zoom=1};
  return {updateFilter:()=>{}};
}

const tooltip=document.getElementById('tooltip');
function updateTooltip(e,node){
  if(!node){hideTooltip();return;}
  const domainColor={wiki:'#4a9eff',calculator:'#d2b244',league:'#b07cc8',material:'#8c7b5b'};
  const color=domainColor[node.domain]||'#888';
  const chips=[];
  if(node.badges)for(const b of node.badges)chips.push(`<span class="chip chip-${b}">${b}</span>`);
  if(node.kind)chips.push(`<span class="chip">${node.kind}</span>`);
  if(node.section)chips.push(`<span class="chip">${esc(node.section)}</span>`);
  if(node.skill)chips.push(`<span class="chip">${esc(node.skill)}</span>`);
  const meta=[];
  if(node.section) meta.push(esc(node.section));
  if(node.skill) meta.push('skill: '+esc(node.skill));
  if(node.badges && node.badges.length) meta.push('badges: '+node.badges.join(', '));
  if(node.creator_link) meta.push('creator: '+esc(node.creator_link));
  if(node.meta && node.meta.geo) meta.push('geo: '+esc(node.meta.geo));
  if(node.meta && node.meta.infra) meta.push('infra: '+esc(node.meta.infra));
  tooltip.innerHTML=`<h3 style="color:${color}">${esc(node.label)}</h3><div class="meta">${node.domain} · in-degree ${node.in_degree||0} · ${(node.connections||[]).length} connections</div><div class="meta">${meta.join(' · ')}</div>${node.description?`<div style="margin:6px 0;color:var(--text-secondary)">${esc(node.description)}</div>`:''}${node.url?`<a class="link" href="${esc(node.url)}" target="_blank" rel="noopener">${esc(node.url)}</a>`:''}<div class="chips">${chips.join('')}</div>`;
  tooltip.style.opacity='1';
  const x=Math.min(e.clientX+14,window.innerWidth-380);const y=Math.min(e.clientY+14,window.innerHeight-220);
  tooltip.style.left=x+'px';tooltip.style.top=y+'px';
}
function hideTooltip(){tooltip.style.opacity='0'}

function renderNodeGrid(nodes){
  const grid=document.getElementById('node-grid');
  const q=(document.getElementById('node-search').value||'').toLowerCase();
  const items=nodes.filter(n=>{if(STATE.filter!=='all'&&n.domain!==STATE.filter)return false;if(q&&!(n.label||'').toLowerCase().includes(q)&&!(n.id||'').toLowerCase().includes(q))return false;return true}).slice(0,240);
  document.getElementById('node-stats').innerHTML=`<div class="stat"><div class="val">${nodes.length.toLocaleString()}</div><div class="label">nodes</div></div><div class="stat"><div class="val">${items.length.toLocaleString()}</div><div class="label">shown</div></div>`;
  grid.innerHTML=items.map((n,i)=>{const color={wiki:'#4a9eff',calculator:'#d2b244',league:'#b07cc8',material:'#8c7b5b'}[n.domain]||'#888';const badges=(n.badges||[]).map(b=>`<span class="chip chip-${b}">${b}</span>`).join('');return `<div class="card" style="animation-delay:${i*0.015}s"><div class="card-header" style="background:${n.bg_color||color}"></div><div class="card-body"><div class="card-info"><div style="font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${n.domain}${n.kind?' · '+n.kind:''}</div><a class="card-title" href="${esc(n.url||'#')}" target="_blank" rel="noopener">${esc(n.label||n.id)}</a>${n.description?`<div class="card-desc">${esc(n.description)}</div>`:''}<div class="card-badges">${badges}</div></div></div></div>`}).join('')||'<div class="empty">No nodes match</div>';
}

function renderCalculatorGrid(items){const grid=document.getElementById('calc-grid');grid.innerHTML=items.map((c,i)=>{const badges=(c.badges||[]).map(b=>`<span class="chip chip-${b}">${b}</span>`).join('');const meta=[];if(c.section)meta.push(esc(c.section));if(c.skill_title||c.skill)meta.push(esc(c.skill_title||c.skill));if(c.creator_link)meta.push('creator: '+esc(c.creator_link));return `<div class="card" style="animation-delay:${i*0.02}s"><div class="card-header" style="background:${c.bg_color||'#888'}"></div><div class="card-body"><div class="card-info"><div style="font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">${meta.join(' · ')}</div><a class="card-title" href="${esc(c.href||'#')}" target="_blank" rel="noopener">${esc(c.title)}</a>${c.desc?`<div class="card-desc">${esc(c.desc)}</div>`:''}<div class="card-badges">${badges}</div></div></div></div>`}).join('')||'<div class="empty">No calculators loaded</div>'}

function renderLeagueGrid(items){
  const grid=document.getElementById('league-grid');
  grid.innerHTML=items.map((n,i)=>{const badges=[];
    if(n.kind==='relic')badges.push('<span class="chip chip-combat">relic</span>');
    if(n.kind==='blessing')badges.push('<span class="chip chip-guide">blessing</span>');
    if(n.kind==='region')badges.push('<span class="chip chip-economic">region</span>');
    if(n.kind==='league-root')badges.push('<span class="chip chip-league">event mode</span>');
    if(n.tier!==undefined)badges.push(`<span class="chip">tier ${n.tier}</span>`);
    return `<div class="card" style="animation-delay:${i*0.02}s"><div class="card-header" style="background:linear-gradient(90deg,#b07cc8,#7a3c9e)"></div><div class="card-body"><div class="card-info"><div style="font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">event mode · ${esc(n.section||'League')}</div><a class="card-title" href="${esc(n.url||'#')}" target="_blank" rel="noopener">${esc(n.label||n.id)}</a>${n.description?`<div class="card-desc">${esc(n.description)}</div>`:''}<div class="card-badges">${badges.join('')}</div></div></div></div>`}).join('')||'<div class="empty">No league data loaded</div>';
}

function renderMaterialGrid(items){const grid=document.getElementById('mat-grid');grid.innerHTML=items.slice(0,200).map((n,i)=>`<div class="card" style="animation-delay:${i*0.02}s"><div class="card-header" style="background:#8c7b5b"></div><div class="card-body"><div class="card-info"><div style="font-size:10px;color:var(--text-quaternary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px">material</div><a class="card-title" href="${esc(n.url||'#')}" target="_blank" rel="noopener">${esc(n.label||n.id)}</a>${n.occurrences?`<div class="card-desc">wiki occurrences: ${n.occurrences}</div>`:''}</div></div></div>`).join('')||'<div class="empty">No material data loaded</div>'}

function wireFilterPills(){document.querySelectorAll('.pill[data-filter]').forEach(btn=>{btn.addEventListener('click',()=>{document.querySelectorAll('.pill[data-filter]').forEach(b=>b.classList.remove('active'));btn.classList.add('active');STATE.filter=btn.dataset.filter;renderNodeGrid(STATE.nodes)})})}
function wireTabs(){document.querySelectorAll('.tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));tab.classList.add('active');document.getElementById('panel-'+tab.dataset.tab).classList.add('active')})})}

async function init(){
  const [topologyRaw,furnRaw,leagueRaw,calcRaw]=await Promise.all([loadJSON('./topology_data.json'),loadJSON('./furniture_wiki_link_sources.json'),loadJSON('./equilibrium_league_data.json'),loadJSON('./calculator_index.json')]);
  const calcNodes=buildCalculatorNodes(calcRaw);
  const topologyResult=buildTopologyNodes(topologyRaw);
  const furnNodes=buildFurnitureNodes(furnRaw);
  const leagueNodes=buildLeagueNodes(leagueRaw);
  const merged=mergeAllSources(topologyResult,furnNodes,calcNodes,leagueNodes);
  STATE.nodes=merged.nodes;STATE.edges=merged.edges;
  const s=summarize(STATE.nodes,STATE.edges);
  renderMeta(s);renderLegend(STATE.nodes);renderNodeGrid(STATE.nodes);renderCalculatorGrid(calcNodes);renderLeagueGrid(leagueNodes);renderMaterialGrid(furnNodes);
  wireFilterPills();wireTabs();initGraph();
  document.getElementById('node-search').addEventListener('input',()=>renderNodeGrid(STATE.nodes));
  document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();STATE.query=q;document.getElementById('node-search').value=q;renderNodeGrid(STATE.nodes)});
}
init();
</script>
