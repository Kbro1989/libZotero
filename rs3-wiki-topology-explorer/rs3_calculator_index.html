<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RS3 Calculator Index — Interactive Widget</title>
<style>
  :root {
    --bg: #0b0d10;
    --surface: #14171c;
    --surface-2: #1c2028;
    --text: #d8dee9;
    --text-dim: #7b8490;
    --accent: #88c0d0;
    --border: #2e3440;
    --radius: 10px;
    --shadow: 0 4px 20px rgba(0,0,0,0.45);
    --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.45;
    min-height: 100vh;
    padding: 24px 16px 64px;
  }
  .container { max-width: 1400px; margin: 0 auto; }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.9rem;
    letter-spacing: 0.5px;
    background: linear-gradient(90deg, #d8dee9, #88c0d0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  header p { color: var(--text-dim); margin-top: 6px; font-size: 0.95rem; }

  /* Controls */
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  .search-wrap {
    position: relative;
    flex: 1 1 260px;
    max-width: 420px;
  }
  .search-wrap input {
    width: 100%;
    padding: 10px 14px 10px 38px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: var(--transition);
  }
  .search-wrap input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(136,192,208,0.15); }
  .search-wrap::before {
    content: "🔍";
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.6;
    font-size: 0.9rem;
  }
  .badge-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge-btn {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-dim);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 0.82rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    transition: var(--transition);
    user-select: none;
  }
  .badge-btn:hover { border-color: var(--accent); color: var(--text); }
  .badge-btn.active { background: var(--accent); color: #0b0d10; border-color: var(--accent); }
  .badge-btn.b-xp.active { background: #d2b244; border-color: #d2b244; color: #1a1a1a; }
  .badge-btn.b-economic.active { background: #409c76; border-color: #409c76; color: #fff; }
  .badge-btn.b-combat.active { background: #bc483d; border-color: #bc483d; color: #fff; }
  .badge-btn.b-guide.active { background: #6385a8; border-color: #6385a8; color: #fff; }

  /* Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 18px;
    position: sticky;
    top: 8px;
    z-index: 50;
    padding: 8px;
    background: rgba(11,13,16,0.85);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  .tab {
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--text-dim);
    border: 1px solid transparent;
    transition: var(--transition);
    position: relative;
  }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab.active { color: var(--accent); background: var(--surface-2); border-color: var(--accent); }
  .tab .count {
    font-size: 0.7rem;
    margin-left: 6px;
    opacity: 0.8;
    background: var(--bg);
    padding: 1px 6px;
    border-radius: 999px;
  }

  /* Grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform var(--transition), box-shadow var(--transition), opacity var(--transition);
    opacity: 1;
    transform: translateY(0);
  }
  .card.hidden { display: none; }
  .card.dim { opacity: 0.25; transform: scale(0.98); pointer-events: none; }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: var(--shadow);
    border-color: #3b4252;
  }
  .card-header {
    height: 5px;
    width: 100%;
    flex-shrink: 0;
  }
  .card-body {
    padding: 14px;
    display: flex;
    gap: 12px;
    align-items: flex-start;
    flex: 1;
  }
  .card-thumb {
    width: 44px;
    height: 44px;
    border-radius: 8px;
    object-fit: contain;
    background: var(--surface-2);
    border: 1px solid var(--border);
    flex-shrink: 0;
  }
  .card-info { flex: 1; min-width: 0; }
  .card-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    display: block;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .card-title:hover { color: var(--accent); text-decoration: underline; }
  .card-desc {
    font-size: 0.82rem;
    color: var(--text-dim);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-badges {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .chip {
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 8px;
    border-radius: 999px;
    color: #fff;
  }
  .chip-xp { background: #d2b244; color: #1a1a1a; }
  .chip-economic { background: #409c76; }
  .chip-combat { background: #bc483d; }
  .chip-guide { background: #6385a8; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
    grid-column: 1 / -1;
  }
  .empty-state h3 { color: var(--text); margin-bottom: 8px; }

  .skill-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin-bottom: 2px;
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: #3b4252; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #4c566a; }

  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr; }
    header h1 { font-size: 1.4rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>⚔️ RuneScape 3 — Calculator Index</h1>
    <p>Functional reactive widget mined from the RuneScape Wiki. Search, filter by badge, and browse by category.</p>
  </header>

  <div class="controls">
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="Search calculators..." autocomplete="off">
    </div>
    <div class="badge-filters">
      <button class="badge-btn b-xp" data-badge="xp">XP</button>
      <button class="badge-btn b-economic" data-badge="economic">Economic</button>
      <button class="badge-btn b-combat" data-badge="combat">Combat</button>
      <button class="badge-btn b-guide" data-badge="guide">Guide</button>
    </div>
  </div>

  <div class="tabs" id="tabBar"></div>
  <div class="grid" id="grid"></div>
</div>

eving/Vault_of_Hereditas", "desc": "", "img": "https://runescape.wiki/images/thumb/Pylon_battery_%28Vault_of_Hereditas%29_detail.png/44px-Pylon_battery_%28Vault_of_Hereditas%29_detail.png?ac410", "badges": ["xp"]}, {"section": "Other", "section_id": "Other", "skill": "wiki-help", "skill_title": "Wiki related", "bg_color": "#777777", "title": "Coordinate conversion", "href": "https://runescape.wiki/w/Calculator:Coordinates", "desc": "", "img": "https://runescape.wiki/images/thumb/World_map_artwork.png/44px-World_map_artwork.png?4e7d8", "badges": []}, {"section": "Other", "section_id": "Other", "skill": "calc-help", "skill_title": "Calculator creation", "bg_color": "#949eaa", "title": "Calculator basics", "href": "https://runescape.wiki/w/RuneScape:Calculators", "desc": "", "img": "https://runescape.wiki/images/thumb/Parchment_%28Olaf%27s_Quest%29_detail.png/44px-Parchment_%28Olaf%27s_Quest%29_detail.png?0d9b5", "badges": []}];

const sections = [...new Set(RAW.map(e => e.section))];
let activeSection = sections[0];
let activeBadges = new Set();
let query = "";

const tabBar = document.getElementById('tabBar');
const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const badgeBtns = document.querySelectorAll('.badge-btn');

function countBySection(sec) {
  return RAW.filter(e => e.section === sec).length;
}

function renderTabs() {
  tabBar.innerHTML = sections.map(sec => {
    const count = countBySection(sec);
    const cls = sec === activeSection ? 'tab active' : 'tab';
    return `<div class="${cls}" data-sec="${esc(sec)}">${esc(sec)}<span class="count">${count}</span></div>`;
  }).join('');
  tabBar.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      activeSection = t.dataset.sec;
      renderTabs();
      renderGrid();
    });
  });
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderGrid() {
  const items = RAW.filter(e => e.section === activeSection)
    .filter(e => {
      if (activeBadges.size === 0) return true;
      return e.badges.some(b => activeBadges.has(b));
    })
    .filter(e => {
      if (!query) return true;
      const q = query.toLowerCase();
      return (e.title + " " + e.desc + " " + e.skill_title).toLowerCase().includes(q);
    });

  if (items.length === 0) {
    grid.innerHTML = `<div class="empty-state"><h3>No matches</h3><p>Try adjusting your search or filters.</p></div>`;
    return;
  }

  grid.innerHTML = items.map((e, i) => {
    const badges = e.badges.map(b => `<span class="chip chip-${b}">${b}</span>`).join('');
    return `
      <div class="card" style="animation-delay:${i*0.02}s">
        <div class="card-header" style="background:${e.bg_color}"></div>
        <div class="card-body">
          <img class="card-thumb" src="${esc(e.img)}" alt="" loading="lazy"
               onerror="this.style.opacity=0;this.style.visibility='hidden'">
          <div class="card-info">
            <div class="skill-label">${esc(e.skill_title)}</div>
            <a class="card-title" href="${esc(e.href)}" target="_blank" rel="noopener">${esc(e.title)}</a>
            <div class="card-desc">${esc(e.desc)}</div>
            <div class="card-badges">${badges}</div>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

searchInput.addEventListener('input', e => {
  query = e.target.value.trim();
  renderGrid();
});

badgeBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const b = btn.dataset.badge;
    if (activeBadges.has(b)) {
      activeBadges.delete(b);
      btn.classList.remove('active');
    } else {
      activeBadges.add(b);
      btn.classList.add('active');
    }
    renderGrid();
  });
});

renderTabs();
renderGrid();
</script>
